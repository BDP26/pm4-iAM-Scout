services:
  postgres:
    build:
      context: ../..
      dockerfile: containers/database/Dockerfile
    container_name: iamscout_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: iamscout
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5434:5432"
    volumes:
      - ${HOST_PROJECT_ROOT}/data:/data
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d iamscout"]
      interval: 5s
      timeout: 5s
      retries: 20

  update_data:
    build:
      context: ../..
      dockerfile: containers/update_data/Dockerfile
    container_name: iamscout_update_data
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: postgres
    volumes:
      - ${HOST_PROJECT_ROOT}/data:/data
    restart: "no"

volumes:
  postgres_data: